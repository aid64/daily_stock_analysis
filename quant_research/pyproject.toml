[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.1.0"
description = "Independent quant research sub-project: data layer, strategy layer, backtest, risk, analyzer."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "daily_stock_analysis contributors" }]
license = { text = "MIT" }

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "tushare>=1.4.0",
    "baostock>=0.8.0",
    "akshare>=1.12.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
backtest = [
    "backtrader>=1.9.78",
    "quantstats>=0.0.62",
    "empyrical>=0.5.5",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
jupyter = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
qr-download = "quant_research.scripts_entry:download_main"
qr-backtest = "quant_research.scripts_entry:backtest_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_research*"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "network: tests that require live network access",
    "slow: tests that are slow to run",
]
