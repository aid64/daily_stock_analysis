# ETF 动量轮动策略配置
# 双动量（绝对 + 相对）+ MA250 过滤 + 国债 ETF 防御轮动
#
# P2 参数优化结论（2026-08-15，详见架构文档 6.2.2）：OFAT + 组合精调在
# 训练段（2013-11 ~ 2021-12）找到的参数组（如 lookback=30/ma_filter=120/
# top_k=5/月调仓/止损-8%/波动率调整，训练段年化 +15%）在样本外
# 2022-01 ~ 2026-08 全部失效（年化 -15%），按预注册规则不予采纳，
# 维持下方 P1 保守默认参数。

name: etf_momentum
params:
  lookback: 60                  # 动量计算窗口（约 3 个月）
  top_k: 3                      # 持仓数
  ma_filter: 250                # 均线过滤窗口（约 1 年）
  min_volume: 1000000           # 流动性过滤：日均成交额（元）
  defensive: 511010.SH          # 防御资产（国债 ETF），风险资产全军覆没时持有
rebalance_freq: W               # W 周 / M 月
max_positions: 3
universe:                       # 默认 ETF 池（宽基 + 行业 + 风格 + 避险 + 防御）
  - 510300.SH  # 沪深300ETF
  - 510500.SH  # 中证500ETF
  - 159915.SZ  # 创业板ETF
  - 512100.SH  # 中证1000ETF
  - 588000.SH  # 科创50ETF
  - 510050.SH  # 上证50ETF
  - 512880.SH  # 证券ETF
  - 515790.SH  # 光伏ETF
  - 515030.SH  # 新能源车ETF
  - 512480.SH  # 半导体ETF
  - 515170.SH  # 食品饮料ETF
  - 512010.SH  # 医药ETF
  - 159531.SZ  # 中证2000ETF（小盘风格维度，2023-03 上市）
  - 512890.SH  # 红利低波ETF（防御价值维度，2019-01 上市）
  - 518880.SH  # 黄金ETF（避险维度，2013-07 上市）
  - 511880.SH  # 银华日利（货币停靠资产，2012-08 上市）
  - 511010.SH  # 国债ETF（防御资产）
