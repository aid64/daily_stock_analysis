name: Dependency Audit

on:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: daily_stock_analysis/requirements.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r daily_stock_analysis/requirements.txt
          python -m pip install pip-audit

      - name: 🔎 Audit installed environment (report-only)
        continue-on-error: true
        run: |
          python -m pip_audit --format json --output pip-audit.json || true
          python -m pip_audit --format columns | tee pip-audit.txt || true

      - name: 📤 Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pip-audit-${{ github.run_number }}
          path: |
            pip-audit.json
            pip-audit.txt
          if-no-files-found: warn
          retention-days: 30
