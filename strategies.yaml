# ============================================================
# strategies.yaml — 策略部署注册表（唯一真源）
# ============================================================
# 与 docs/strategy-catalog.md 一一对应；改参数 = 改本文件，不改代码
# （mandate.yaml 先例）。状态机：registered → replicating → shadow
# → active；任意阶段可 rejected / dormant。详见 strategy-catalog.md 第一节。
# 纪律：参数取结构值或社区声明值（预注册），不做网格调参。
# 消费方：src/services/strategy_engine.py（只评估 active）。
# ============================================================

# ── 买侧授权（P2-7）：默认只读，用户填 universe 并把 intent 改为 signal
#    才允许观察池候选经组合器生成买入调仓单；否则决策包只展示不落单。
#    这是 v4.2 "买侧不无限期悬空、但授权是增强非前提"的落点。
buy_side:
  intent: observe            # observe（只读展示，默认）| signal（授权落单）
  universe: []               # 允许买入的标的池（intent=signal 时生效；空=不落单）

strategies:
  # ── 系统策略（P2 注册合一：身份登记进注册表，编排由 portfolio_compositor
  #    内的 strategies/ 模块承担——轻上下文评估器不适用，故无 evaluator；
  #    参数真源在各自配置处，本表只登记身份/tier/status）──
  - id: user_rules
    name: 用户价格规则（止损/止盈）
    tier: exit_rule
    risk: bounded
    status: active
    system: true
    params_source: .env AGENT_EVENT_ALERT_RULES_JSON（结构锚重生，见 regen_price_rules.py）

  - id: concentration
    name: 组合集中度
    tier: risk_control
    risk: bounded
    status: active
    system: true
    params_source: mandate.yaml / config（阈值 35%；P1.5 账户规模感知保底一手）

  - id: e2_timing
    name: E2 估值择时
    tier: cash_management
    risk: bounded
    status: active
    system: true
    params_source: quant_research PIT 转债分位（expanding，>80% 防守）

  # ── 现金管理层（active：规则性正期望 / 无风险，免回测）──
  - id: reverse_repo_window
    name: 国债逆回购窗口
    tier: cash_management
    risk: zero
    status: active
    evaluator: reverse_repo_window
    params:
      product_sh: GC001        # 沪市 1 天期 204001
      product_sz: R-001        # 深市 1 天期 131810
      min_cash: 1000           # 起投门槛（1000 整数倍）

  - id: cb_new_issue
    name: 转债打新汇总
    tier: cash_management
    risk: near_zero
    status: active
    evaluator: cb_new_issue
    params:
      lookahead_days: 2        # 决策包汇总未来 2 日内的申购/缴款/上市提醒

  # ── 低风险层（registered：待换源复现后 shadow → active）──
  - id: cb_ytm_floor
    name: 转债高YTM底仓
    tier: low_risk
    risk: bounded
    status: registered
    params:
      min_ytm: 2.0             # 到期收益率下限（%）
      min_rating: AA           # 评级下限
      max_price: 108           # 贴面值上限

  - id: closed_fund_discount
    name: 封基/定开LOF折价套利
    tier: low_risk
    risk: bounded
    status: registered
    params:
      min_discount: 5.0        # 折价率出手门槛（%）

  - id: dividend_lowvol_core
    name: 红利低波核心仓（持有型，禁择时）
    tier: low_risk
    risk: equity_drawdown
    status: registered
    params:
      universe: [515450]       # 红利低波 ETF（候选池，复现时定稿）
      timing_signal: forbidden # 教训：择时信号会失效，持有型成立

  # ── 中风险层（registered：卫星仓候选，需完整管道 + E2 回落）──
  # 部署纪律（2026-09-26 对账修正）：可推进的条目必须引用本项目 quant
  # 管线的验证产物（walk-forward/过拟合审计+快照 sha256）；只有社区
  # 来源的条目标注「未复现——不推进」，intake 永远不会为它们产出裁决。
  - id: etf_momentum
    name: ETF动量轮动（17池·本项目验证版）
    tier: satellite
    risk: mid
    status: registered
    source: 本项目 quant 管线（quant_research/output/：walk_forward_etf_2020_2026_locked.csv + overfit_audit_etf_momentum.json，快照 sha256=273c8153…）
    evidence: |
      walk-forward 8 折（2023-01~2026-08 样本外）：2023 两折 -9.9%/-8.7%
      年化（回撤 24%/16%），2025H2 +14.1%，2026H1 +37.6%，2026-07~08 +6.3%；
      过拟合审计 DSR 0.645 通过（44 次诚实试验）。
      待办：打包 strategy_intake 裁决报告（先刷新 walk-forward 至当前日）。
    params:
      lookback: 60                    # 与 quant_research/config/strategy/etf_momentum.yaml 同源
      top_k: 3
      ma_filter: 250
      rebalance_freq: W
      defensive: 511010               # 国债 ETF（风险资产全军覆没时）
      universe_size: 17               # 池见 quant_research 配置（宽基+行业+风格+避险+防御）

  - id: etf_momentum_rotation4
    name: ETF四资产动量轮动（社区版）
    tier: satellite
    risk: mid
    status: registered
    source: 知乎·升值之路（2026-09 检索）
    evidence_status: 未复现——不推进（与已验证的 etf_momentum 是不同策略；8年年化31.3% 为外部声称值）
    params:
      assets: [518880, 513100, 159915, 510300]   # 黄金/纳指/创业板/沪深300
      lookback_days: 25                            # 动量窗口
      score: return_x_r2                            # 涨幅×R²

  - id: etf_multifactor_top7
    name: 多因子ETF轮动（卫星主力候选）
    tier: satellite
    risk: mid
    status: registered
    source: 知乎·quantsteve（2026-09 检索）
    params:
      weights: {momentum: 45, volatility: 20, correlation: 20, drawdown: 10, liquidity: 5}
      top_n: 7
      rebalance_days: 7

  - id: industry_momentum_rotation
    name: 行业动量轮动
    tier: satellite
    risk: mid
    status: registered
    params:
      universe_size: 15       # 行业 ETF 池规模（复现时定稿）
      top_n: 3
      lookback_days: 60

  - id: small_cap_rotation
    name: 小市值轮动（风格暴露极端，排后）
    tier: satellite
    risk: high
    status: dormant
    params:
      index: 399101           # 中小综指
      top_n: 5
